<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Examples of common joint actions</title>
  <desc id="desc">Four schematic panels show elbow flexion and extension, shoulder abduction and adduction, forearm pronation and supination, and ankle dorsiflexion and plantarflexion. Arrows show direction; drawings are conceptual, not a range-of-motion standard.</desc>
  <defs><style>.bg{fill:#f8fafc}.card{fill:white;stroke:#cbd5e1;stroke-width:2}.h{font:700 22px sans-serif;fill:#172554}.t{font:17px sans-serif;fill:#334155}.s{font:14px sans-serif;fill:#64748b}.bone{stroke:#334155;stroke-width:14;stroke-linecap:round;fill:none}.joint{fill:#f59e0b;stroke:#92400e;stroke-width:2}.arrow{stroke:#0f766e;stroke-width:4;fill:none;marker-end:url(#a)}.palm{fill:#fde68a;stroke:#92400e;stroke-width:3}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/></marker></defs>
  <rect class="bg" width="1200" height="700" rx="24"/>
  <g transform="translate(20 20)"><rect class="card" width="565" height="310" rx="18"/><text class="h" x="24" y="42">Elbow: flexion ↔ extension</text><path class="bone" d="M170 110 L170 220 M170 220 L255 220"/><circle class="joint" cx="170" cy="220" r="12"/><path class="bone" d="M360 110 L360 220 M360 220 L440 155"/><circle class="joint" cx="360" cy="220" r="12"/><path class="arrow" d="M205 198 Q250 160 290 193"/><text class="t" x="80" y="270">Bending: elbow angle decreases</text><text class="t" x="350" y="270">Straightening: angle increases</text></g>
  <g transform="translate(615 20)"><rect class="card" width="565" height="310" rx="18"/><text class="h" x="24" y="42">Shoulder: abduction ↔ adduction</text><circle class="joint" cx="280" cy="150" r="12"/><path class="bone" d="M280 150 L280 250 M280 150 L170 98 M280 150 L390 98"/><path class="arrow" d="M210 124 Q245 85 270 115"/><text class="t" x="45" y="270">Away from midline</text><text class="t" x="340" y="270">Toward the side</text></g>
  <g transform="translate(20 365)"><rect class="card" width="565" height="310" rx="18"/><text class="h" x="24" y="42">Forearm: supination ↔ pronation</text><path class="bone" d="M150 155 L270 155 M330 155 L450 155"/><rect class="palm" x="238" y="115" width="64" height="82" rx="22"/><rect class="palm" x="418" y="115" width="64" height="82" rx="22"/><path class="arrow" d="M300 206 Q355 245 410 206"/><text class="t" x="120" y="258">Palm turns up</text><text class="t" x="360" y="258">Palm turns down</text></g>
  <g transform="translate(615 365)"><rect class="card" width="565" height="310" rx="18"/><text class="h" x="24" y="42">Ankle: dorsiflexion ↔ plantarflexion</text><path class="bone" d="M185 95 L185 200 L290 200 M365 95 L365 200 L465 155"/><circle class="joint" cx="185" cy="200" r="11"/><circle class="joint" cx="365" cy="200" r="11"/><path class="arrow" d="M230 175 Q260 142 290 172"/><text class="t" x="55" y="260">Toes toward shin</text><text class="t" x="330" y="260">Foot points away</text></g>
</svg>