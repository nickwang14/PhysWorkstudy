<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Schematic forms of synovial joints</title>
  <desc id="desc">Six conceptual drawings compare hinge, pivot, ball-and-socket, plane, condyloid, and saddle joint shapes with arrows showing typical movement directions. The diagrams simplify real anatomy and do not show all joint motion.</desc>
  <defs><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.h{font:700 21px sans-serif;fill:#172554}.t{font:16px sans-serif;fill:#334155}.s{font:13px sans-serif;fill:#64748b}.bone{fill:#e2e8f0;stroke:#475569;stroke-width:3}.joint{fill:#fbbf24;stroke:#92400e;stroke-width:3}.a{stroke:#0f766e;stroke-width:4;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/></marker></defs>
  <rect class="bg" width="1200" height="720" rx="24"/>
  <g transform="translate(20 20)"><rect class="card" width="370" height="320" rx="18"/><text class="h" x="22" y="42">Hinge</text><text class="s" x="22" y="66">Example: elbow</text><path class="bone" d="M150 95 L150 195 L180 195 L180 95 Z"/><path class="bone" d="M150 195 Q165 175 180 195 L255 250 L235 275 L160 218 Z"/><path class="a" d="M210 215 Q280 200 255 145"/><text class="t" x="22" y="294">Mainly bends and straightens</text></g>
  <g transform="translate(415 20)"><rect class="card" width="370" height="320" rx="18"/><text class="h" x="22" y="42">Pivot</text><text class="s" x="22" y="66">Example: forearm rotation</text><rect class="bone" x="85" y="135" width="200" height="55" rx="25"/><circle class="joint" cx="185" cy="162" r="38"/><path class="a" d="M150 105 Q205 75 240 108"/><text class="t" x="22" y="294">Turns around a central axis</text></g>
  <g transform="translate(810 20)"><rect class="card" width="370" height="320" rx="18"/><text class="h" x="22" y="42">Ball-and-socket</text><text class="s" x="22" y="66">Examples: shoulder, hip</text><path class="bone" d="M125 105 L125 165 L185 165 L185 105 Z"/><circle class="joint" cx="185" cy="188" r="42"/><path class="bone" d="M185 230 L185 268 L220 268 L220 230 Z"/><path class="a" d="M245 165 Q290 190 252 226"/><text class="t" x="22" y="294">Moves in several directions</text></g>
  <g transform="translate(20 375)"><rect class="card" width="370" height="320" rx="18"/><text class="h" x="22" y="42">Plane</text><text class="s" x="22" y="66">Example: some wrist bones</text><path class="bone" d="M85 145 L270 145 L250 185 L105 185 Z"/><path class="bone" d="M105 190 L250 190 L270 230 L85 230 Z"/><path class="a" d="M130 125 L245 125"/><text class="t" x="22" y="294">Mostly glides across a surface</text></g>
  <g transform="translate(415 375)"><rect class="card" width="370" height="320" rx="18"/><text class="h" x="22" y="42">Condyloid</text><text class="s" x="22" y="66">Example: knuckle joint</text><ellipse class="joint" cx="185" cy="177" rx="82" ry="38"/><path class="bone" d="M140 110 L230 110 L230 140 Q185 158 140 140 Z M140 215 Q185 198 230 215 L230 250 L140 250 Z"/><path class="a" d="M95 178 L125 178 M185 95 L185 115"/><text class="t" x="22" y="294">Bends and moves side to side</text></g>
  <g transform="translate(810 375)"><rect class="card" width="370" height="320" rx="18"/><text class="h" x="22" y="42">Saddle</text><text class="s" x="22" y="66">Example: thumb base</text><path class="joint" d="M115 190 Q140 125 185 170 Q230 215 270 150 L270 215 Q225 275 185 220 Q145 165 115 245 Z"/><path class="a" d="M185 115 L185 145 M95 200 L120 200"/><text class="t" x="22" y="294">Two main directions of motion</text></g>
</svg>