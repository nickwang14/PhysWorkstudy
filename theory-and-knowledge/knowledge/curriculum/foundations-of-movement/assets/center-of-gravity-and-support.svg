<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Center-of-gravity projection and support area</title>
  <desc id="desc">Two simplified standing figures show an imagined vertical projection from the center of gravity into the area between the feet. One wide stance and one narrow stance illustrate how support geometry changes; the diagram is static and does not represent all dynamic balance conditions.</desc>
  <defs><style>.bg{fill:#f8fafc}.card{fill:white;stroke:#cbd5e1;stroke-width:2}.h{font:700 23px sans-serif;fill:#172554}.t{font:17px sans-serif;fill:#334155}.s{font:14px sans-serif;fill:#64748b}.body{stroke:#334155;stroke-width:16;stroke-linecap:round;stroke-linejoin:round;fill:none}.cog{fill:#ef4444}.projection{stroke:#ef4444;stroke-width:4;stroke-dasharray:9 7}.base{fill:#38bdf8;fill-opacity:.22;stroke:#0284c7;stroke-width:3}.foot{fill:#94a3b8;stroke:#334155;stroke-width:2}</style></defs>
  <rect class="bg" width="1100" height="560" rx="24"/>
  <g transform="translate(20 20)"><rect class="card" width="520" height="520" rx="18"/><text class="h" x="24" y="46">Wider base of support</text><circle class="body" cx="260" cy="120" r="28"/><path class="body" d="M260 150 L260 285 M260 185 L190 235 M260 185 L330 235 M260 285 L205 390 M260 285 L315 390"/><circle class="cog" cx="260" cy="230" r="10"/><path class="projection" d="M260 240 L260 410"/><path class="base" d="M165 405 Q260 380 355 405 L385 440 L135 440 Z"/><ellipse class="foot" cx="190" cy="420" rx="48" ry="17"/><ellipse class="foot" cx="330" cy="420" rx="48" ry="17"/><text class="t" x="24" y="480">Projection falls well inside the foot support area.</text></g>
  <g transform="translate(560 20)"><rect class="card" width="520" height="520" rx="18"/><text class="h" x="24" y="46">Narrow base of support</text><circle class="body" cx="260" cy="120" r="28"/><path class="body" d="M260 150 L260 285 M260 185 L190 235 M260 185 L330 235 M260 285 L235 390 M260 285 L285 390"/><circle class="cog" cx="260" cy="230" r="10"/><path class="projection" d="M260 240 L260 410"/><path class="base" d="M210 405 Q260 390 310 405 L330 440 L190 440 Z"/><ellipse class="foot" cx="235" cy="420" rx="38" ry="17"/><ellipse class="foot" cx="285" cy="420" rx="38" ry="17"/><text class="t" x="24" y="480">Support geometry is narrower side-to-side.</text></g>
</svg>