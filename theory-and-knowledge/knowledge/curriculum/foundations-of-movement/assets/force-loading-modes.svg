<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Four simplified loading modes</title>
  <desc id="desc">Four panels use arrows on a block to illustrate compression, tension, shear, and torsion. These are general mechanical patterns, not a prediction of the forces in an individual's tissues.</desc>
  <defs><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.h{font:700 23px sans-serif;fill:#172554}.t{font:16px sans-serif;fill:#334155}.block{fill:#dbeafe;stroke:#1e40af;stroke-width:3}.a{stroke:#dc2626;stroke-width:5;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#dc2626"/></marker></defs>
  <rect class="bg" width="1100" height="650" rx="24"/>
  <g transform="translate(20 20)"><rect class="card" width="520" height="285" rx="18"/><text class="h" x="24" y="45">Compression</text><rect class="block" x="210" y="115" width="100" height="90" rx="8"/><path class="a" d="M125 160 L195 160 M395 160 L325 160"/><text class="t" x="24" y="255">Forces press toward the material.</text></g>
  <g transform="translate(560 20)"><rect class="card" width="520" height="285" rx="18"/><text class="h" x="24" y="45">Tension</text><rect class="block" x="210" y="115" width="100" height="90" rx="8"/><path class="a" d="M215 160 L125 160 M305 160 L395 160"/><text class="t" x="24" y="255">Forces pull away from the material.</text></g>
  <g transform="translate(20 325)"><rect class="card" width="520" height="285" rx="18"/><text class="h" x="24" y="45">Shear</text><rect class="block" x="210" y="115" width="100" height="90" rx="8"/><path class="a" d="M130 145 L200 145 M390 175 L320 175"/><text class="t" x="24" y="255">Adjacent parts are urged to slide.</text></g>
  <g transform="translate(560 325)"><rect class="card" width="520" height="285" rx="18"/><text class="h" x="24" y="45">Torsion</text><rect class="block" x="210" y="115" width="100" height="90" rx="8"/><path class="a" d="M145 130 Q105 180 160 205 M375 205 Q415 155 360 125"/><text class="t" x="24" y="255">Opposing turns twist the material.</text></g>
</svg>