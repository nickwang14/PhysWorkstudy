<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Open- and closed-chain examples</title>
  <desc id="desc">Two original schematics compare a seated knee extension with the foot free to move and a squat with the feet supported on the floor. The diagram emphasizes contact conditions, not exercise quality.</desc>
  <defs><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.h{font:700 24px sans-serif;fill:#172554}.t{font:18px sans-serif;fill:#334155}.s{font:15px sans-serif;fill:#64748b}.bone{fill:none;stroke:#334155;stroke-width:18;stroke-linecap:round;stroke-linejoin:round}.j{fill:#f59e0b;stroke:#92400e;stroke-width:2}.support{stroke:#0f766e;stroke-width:8}.arrow{stroke:#ef4444;stroke-width:4;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ef4444"/></marker></defs>
  <rect class="bg" width="1100" height="500" rx="24"/>
  <g transform="translate(20 20)"><rect class="card" width="520" height="450" rx="18"/><text class="h" x="24" y="46">Open chain: foot free</text><text class="s" x="24" y="74">Seated knee extension</text><path class="bone" d="M185 145 L300 190 L365 280"/><circle class="j" cx="300" cy="190" r="13"/><path class="bone" d="M365 280 L445 280"/><path class="arrow" d="M405 265 Q450 220 438 185"/><path class="support" d="M250 305 L365 305 L365 330 M270 305 L270 345"/><text class="t" x="24" y="395">Foot moves freely through space.</text><text class="s" x="24" y="425">The distal end is not fixed to the floor.</text></g>
  <g transform="translate(560 20)"><rect class="card" width="520" height="450" rx="18"/><text class="h" x="24" y="46">Closed chain: foot supported</text><text class="s" x="24" y="74">Squat</text><circle class="j" cx="300" cy="130" r="22"/><path class="bone" d="M300 152 L300 245 L250 320 L255 395 M300 245 L360 320 L355 395 M300 175 L220 220 M300 175 L375 215"/><path class="support" d="M205 405 L285 405 M330 405 L390 405"/><path class="arrow" d="M450 180 Q470 220 445 260"/><text class="t" x="24" y="435">Hands or feet contact a stable support.</text></g>
</svg>