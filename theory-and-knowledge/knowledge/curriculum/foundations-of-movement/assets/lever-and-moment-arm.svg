<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">External lever arm at the elbow</title>
  <desc id="desc">A simplified forearm is shown horizontal from an elbow pivot with a load in the hand. A downward force line and a perpendicular distance label illustrate an external moment arm. It is a schematic, not a measurement of an individual joint.</desc>
  <defs><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.h{font:700 25px sans-serif;fill:#172554}.t{font:18px sans-serif;fill:#334155}.s{font:15px sans-serif;fill:#64748b}.bone{stroke:#475569;stroke-width:24;stroke-linecap:round}.pivot{fill:#f59e0b;stroke:#92400e;stroke-width:3}.force{stroke:#dc2626;stroke-width:5;marker-end:url(#a)}.distance{stroke:#0f766e;stroke-width:4;stroke-dasharray:8 6}.tick{stroke:#0f766e;stroke-width:3}</style><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#dc2626"/></marker></defs>
  <rect class="bg" width="1000" height="540" rx="24"/><rect class="card" x="20" y="20" width="960" height="500" rx="18"/>
  <text class="h" x="55" y="65">A load farther from the pivot changes turning demand</text>
  <circle class="pivot" cx="200" cy="310" r="23"/><text class="t" x="90" y="365">elbow / pivot</text>
  <path class="bone" d="M220 310 L785 310"/><text class="t" x="420" y="355">forearm (simplified lever)</text>
  <rect x="745" y="245" width="88" height="65" rx="10" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3"/><text class="t" x="750" y="235">load</text>
  <path class="force" d="M790 310 L790 430"/><text class="t" x="810" y="415">weight force</text>
  <path class="distance" d="M200 390 L790 390"/><path class="tick" d="M200 378 L200 402 M790 378 L790 402"/><text class="t" x="420" y="425">perpendicular moment arm</text>
  <text class="s" x="55" y="475">Moving the same load farther away can increase the external turning demand.</text>
</svg>