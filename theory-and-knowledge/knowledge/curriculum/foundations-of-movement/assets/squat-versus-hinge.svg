<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Simplified squat and hinge pattern comparison</title>
  <desc id="desc">Two side-view stick figures compare a squat with more coordinated hip and knee bend and a hinge with greater hip-focused trunk inclination. The illustration is schematic; individual proportions and strategies vary.</desc>
  <defs><style>.bg{fill:#f8fafc}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.h{font:700 25px sans-serif;fill:#172554}.t{font:17px sans-serif;fill:#334155}.s{font:14px sans-serif;fill:#64748b}.bone{stroke:#334155;stroke-width:16;stroke-linecap:round;stroke-linejoin:round;fill:none}.joint{fill:#f59e0b;stroke:#92400e;stroke-width:2}.arrow{stroke:#0f766e;stroke-width:4;fill:none;marker-end:url(#a)}.ground{stroke:#64748b;stroke-width:4}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/></marker></defs>
  <rect class="bg" width="1100" height="560" rx="24"/>
  <g transform="translate(20 20)"><rect class="card" width="520" height="520" rx="18"/><text class="h" x="24" y="48">Squat pattern</text><text class="s" x="24" y="75">Hip and knee bend together</text><circle class="joint" cx="250" cy="130" r="22"/><path class="bone" d="M250 152 L245 250 M245 250 L200 340 L205 430 M245 250 L300 340 L305 430 M250 175 L195 225 M250 175 L310 215"/><circle class="joint" cx="245" cy="250" r="10"/><circle class="joint" cx="200" cy="340" r="9"/><circle class="joint" cx="300" cy="340" r="9"/><path class="ground" d="M135 438 L360 438"/><path class="arrow" d="M390 190 L390 300"/><text class="t" x="24" y="480">Compare hip, knee, and ankle actions.</text></g>
  <g transform="translate(560 20)"><rect class="card" width="520" height="520" rx="18"/><text class="h" x="24" y="48">Hinge pattern</text><text class="s" x="24" y="75">Hip motion with a trunk incline</text><circle class="joint" cx="250" cy="145" r="22"/><path class="bone" d="M270 160 L330 250 L260 310 L175 390 L180 440 M260 310 L320 390 L325 440 M290 200 L360 225 M290 200 L365 185"/><circle class="joint" cx="330" cy="250" r="10"/><circle class="joint" cx="260" cy="310" r="10"/><circle class="joint" cx="320" cy="390" r="9"/><path class="ground" d="M135 448 L380 448"/><path class="arrow" d="M395 250 Q420 290 395 330"/><text class="t" x="24" y="490">Knee bend varies by exercise version.</text></g>
</svg>